<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#yellowGrad)"/>

  <!-- Distinctive Beeline Stripes Accent -->
  <g opacity="0.12">
    <path d="M-50 150 L562 -100 L562 -40 L-50 210 Z" fill="#000000"/>
    <path d="M-50 290 L562 40 L562 100 L-50 350 Z" fill="#000000"/>
    <path d="M-50 430 L562 180 L562 240 L-50 490 Z" fill="#000000"/>
  </g>

  <!-- Central Badge with Phone/App Store identity -->
  <g filter="url(#shadow)">
    <!-- Inner Dark Circle Card -->
    <circle cx="256" cy="256" r="180" fill="url(#darkGrad)"/>
    
    <!-- Outer Ring Accent -->
    <circle cx="256" cy="256" r="172" fill="none" stroke="#FFD200" stroke-width="8" stroke-dasharray="24 12"/>

    <!-- Striped Bee/Beeline Emblem -->
    <g transform="translate(156, 126)">
      <!-- Smartphone Silhouette -->
      <rect x="35" y="10" width="130" height="230" rx="26" fill="#1C1917" stroke="#FFD200" stroke-width="12"/>
      <!-- Screen -->
      <rect x="50" y="36" width="100" height="175" rx="14" fill="#292524"/>
      <!-- Beeline Stripes inside screen -->
      <path d="M50 70 L150 70" stroke="#FFD200" stroke-width="16"/>
      <path d="M50 110 L150 110" stroke="#FFD200" stroke-width="16"/>
      <path d="M50 150 L150 150" stroke="#FFD200" stroke-width="16"/>
      <!-- Speaker -->
      <line x1="85" y1="24" x2="115" y2="24" stroke="#FFD200" stroke-width="4" stroke-linecap="round"/>
      <!-- Home Indicator -->
      <circle cx="100" cy="224" r="5" fill="#FFD200"/>
    </g>

    <!-- Bold Letter "B" Emblem -->
    <circle cx="340" cy="330" r="56" fill="#FFD200" stroke="#1C1917" stroke-width="8"/>
    <text x="340" y="352" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#1C1917" text-anchor="middle">B</text>
  </g>
</svg>
