version: '3.8'

services:
  pos-api:
    build: .
    container_name: paxtaobod_beeline_pos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - POS_OWNER_PIN=${POS_OWNER_PIN:-}
    volumes:
      - ./data:/app/data
